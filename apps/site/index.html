<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Animated line icons for React and Vue. Each icon has its own small motion, made with CSS only."
    />
    <title>nudge-icons</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        const t = localStorage.getItem("nudge-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
