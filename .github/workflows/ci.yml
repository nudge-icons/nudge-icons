name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Icons, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:icons
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Also bundles one icon from every entry and fails if any other icon gets in.
      - run: pnpm build

  vue-3-3:
    name: Vue 3.3 (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nudge-icons/vue add --save-dev vue@3.3.13
      - run: pnpm build:icons
      - run: pnpm vitest run packages/vue
      - run: pnpm --filter @nudge-icons/vue typecheck

  browser:
    name: Motion in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
      - run: pnpm --filter @nudge-icons/storybook exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/storybook/test-results
          retention-days: 7

  chromatic:
    name: Visual review (Chromatic)
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic compares against earlier builds by git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: >
          pnpm --filter @nudge-icons/storybook exec chromatic
          --storybook-build-dir storybook-static
          --exit-zero-on-changes
          --auto-accept-changes main
