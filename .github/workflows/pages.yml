name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:icons
      - run: pnpm build:registry
      # Link-preview images: restored from the cache and rendered again only when an icon,
      # its motion text or the image script changed, so most runs skip the browser.
      - uses: actions/cache@v6
        with:
          path: apps/site/public/og
          key: og-${{ hashFiles('icons/**', 'scripts/build-og-images.ts', 'scripts/lib/icon-list.ts') }}
          restore-keys: og-
      - id: og
        run: pnpm build:og --check
      - if: steps.og.outputs.stale != '0'
        run: pnpm exec playwright install --with-deps chromium
      # Always runs: it also removes images of deleted icons, which needs no browser.
      - run: pnpm build:og
      - run: pnpm --filter @nudge-icons/site build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # GitHub Pages on the free plan needs a public repository; until then only the build runs.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
